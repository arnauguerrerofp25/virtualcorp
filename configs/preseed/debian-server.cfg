# =========================================================
# Preseed: template Debian Server (VirtualCorp, activitat 2)
# =========================================================
# Instal·lació mínima sense entorn gràfic: servidors del CPD, DMZ i
# impressores. Cap contrasenya: l'accés és només per clau SSH.

#### Localització
d-i debian-installer/locale string ca_ES.UTF-8
d-i keyboard-configuration/xkb-keymap select es

#### Xarxa: DHCP a la primera interfície
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-server
d-i netcfg/hostname string debian-server
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean false

#### Rèplica de paquets
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

#### Comptes: sense root; sysadmin amb la contrasenya bloquejada
d-i passwd/root-login boolean false
d-i passwd/user-fullname string VirtualCorp sysadmin
d-i passwd/username string sysadmin
d-i passwd/user-password-crypted password !

#### Rellotge
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Madrid
d-i clock-setup/ntp boolean true

#### Disc: una partició arrel ext4 + swap
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman/default_filesystem string ext4
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#### Paquets: només servidor SSH i sudo
d-i apt-setup/disable-cdrom-entries boolean true
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string sudo
d-i pkgsel/upgrade select none
d-i pkgsel/install-language-support boolean false
popularity-contest popularity-contest/participate boolean false

#### Carregador d'arrencada
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

#### Final: claus SSH, preparació per clonar i apagar
d-i preseed/late_command string sh /cdrom/vcorp/late_command.sh
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
